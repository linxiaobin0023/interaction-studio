name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.lock
      - name: Install locked development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -c apps/api/constraints.lock -e 'apps/api[dev]'
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify Studio frontend
        run: |
          npm ci --prefix apps/web --no-audit --no-fund
          npm run check --prefix apps/web
          npm run test --prefix apps/web
          npm run build --prefix apps/web
      - name: Verify source, contracts, migration and mock evidence
        run: |
          make lint
          make test
          make manifest-verify
          make dataset-seals-verify
          make benchmark-prepare
          docker compose config -q
      - name: Build production API image
        run: docker compose build api
      - name: Verify packaged Studio jobs and QC against PostgreSQL
        run: |
          docker compose up -d --wait postgres
          .venv/bin/python tools/smoke_studio_container.py --restore-report /tmp/studio-restore-report.json
